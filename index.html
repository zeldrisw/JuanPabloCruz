<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página con Banners y Carruseles</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- BANNER 1: Banner Principal con Botones -->
  <section class="banner banner-principal">
    <!-- Cambia la ruta por tu imagen principal -->
    <img src="https://via.placeholder.com/1200x500" alt="Banner Principal" class="banner-img">
    <div class="overlay">
      <h1>Bienvenido a Nuestro Sitio</h1>
      <p>Descubre todo lo que tenemos para ofrecerte</p>
      <div class="button-group">
        <a href="#" class="btn btn-primary">Explorar</a>
        <a href="#" class="btn btn-secondary">Contactar</a>
        <a href="#" class="btn btn-outline">Saber Más</a>
      </div>
    </div>
  </section>

  <!-- BANNER 2: Carrusel 1 -->
  <section class="banner-carousel-container">
    <h2>Nuestros Productos</h2>
    <div class="carousel">
      <div class="carousel-track">
        <!-- Reemplaza con tus imágenes -->
        <div class="carousel-slide"><img src="https://via.placeholder.com/400x250/3357FF/FFFFFF?text=Imagen+1" alt="Slider 1-1"></div>
        <div class="carousel-slide"><img src="https://via.placeholder.com/400x250/33FF57/FFFFFF?text=Imagen+2" alt="Slider 1-2"></div>
        <div class="carousel-slide"><img src="https://via.placeholder.com/400x250/FF5733/FFFFFF?text=Imagen+3" alt="Slider 1-3"></div>
        <div class="carousel-slide"><img src="https://via.placeholder.com/400x250/F033FF/FFFFFF?text=Imagen+4" alt="Slider 1-4"></div>
      </div>
    </div>
  </section>

  <!-- BANNER 3: Carrusel 2 -->
  <section class="banner-carousel-container">
    <h2>Servicios Destacados</h2>
    <div class="carousel">
      <div class="carousel-track">
        <!-- Reemplaza con tus imágenes -->
        <div class="carousel-slide"><img src="https://via.placeholder.com/400x250/FFC300/333333?text=Servicio+1" alt="Slider 2-1"></div>
        <div class="carousel-slide"><img src="https://via.placeholder.com/400x250/DAF7A6/333333?text=Servicio+2" alt="Slider 2-2"></div>
        <div class="carousel-slide"><img src="https://via.placeholder.com/400x250/581845/FFFFFF?text=Servicio+3" alt="Slider 2-3"></div>
        <div class="carousel-slide"><img src="https://via.placeholder.com/400x250/900C3F/FFFFFF?text=Servicio+4" alt="Slider 2-4"></div>
      </div>
    </div>
  </section>

  <!-- BANNER 4: Carrusel 3 -->
  <section class="banner-carousel-container">
    <h2>Galería de Galardones</h2>
    <div class="carousel">
      <div class="carousel-track">
        <!-- Reemplaza con tus imágenes -->
        <div class="carousel-slide"><img src="https://via.placeholder.com/400x250/1C2833/FFFFFF?text=Logro+1" alt="Slider 3-1"></div>
        <div class="carousel-slide"><img src="https://via.placeholder.com/400x250/28B463/FFFFFF?text=Logro+2" alt="Slider 3-2"></div>
        <div class="carousel-slide"><img src="https://via.placeholder.com/400x250/B7950B/FFFFFF?text=Logro+3" alt="Slider 3-3"></div>
        <div class="carousel-slide"><img src="https://via.placeholder.com/400x250/8E44AD/FFFFFF?text=Logro+4" alt="Slider 3-4"></div>
      </div>
    </div>
  </section>

  <!-- BANNER 5: Carrusel 4 -->
  <section class="banner-carousel-container">
    <h2>Marcas e Integraciones</h2>
    <div class="carousel">
      <div class="carousel-track">
        <!-- Reemplaza con tus imágenes -->
        <div class="carousel-slide"><img src="https://via.placeholder.com/400x250/117A65/FFFFFF?text=Marca+1" alt="Slider 4-1"></div>
        <div class="carousel-slide"><img src="https://via.placeholder.com/400x250/A6ACAF/333333?text=Marca+2" alt="Slider 4-2"></div>
        <div class="carousel-slide"><img src="https://via.placeholder.com/400x250/D35400/FFFFFF?text=Marca+3" alt="Slider 4-3"></div>
        <div class="carousel-slide"><img src="https://via.placeholder.com/400x250/2E4053/FFFFFF?text=Marca+4" alt="Slider 4-4"></div>
      </div>
    </div>
  </section>

</body>
</html>
